name: Build YMusic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "YMusic/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read
  issues: write

# Новый пуш в main отменяет предыдущую сборку — не держим залипший раннер.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodegen --version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      # Ключи OAuth в сборке больше не нужны: вход идёт через клиент
      # официального приложения (AuthConfig), секретов в репозитории нет.
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show schemes
        run: xcodebuild -list -project YMusic.xcodeproj

      # Сборка под устройство (arm64), без подписи: для TrollStore.
      - name: Build (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project YMusic.xcodeproj \
            -scheme YMusic \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos/YMusic.app"
          test -d "$APP" || { echo "app not found at $APP"; exit 1; }
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/YMusic.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry YMusic.ipa Payload
          ls -lh YMusic.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-ipa
          path: ${{ runner.temp }}/YMusic.ipa
          if-no-files-found: error

      # ВРЕМЕННО: публикует ошибки сборки в issue, чтобы их можно было прочитать.
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/build.log"
          OUT="$RUNNER_TEMP/issue.md"
          {
            echo "Сборка упала на коммите \`$GITHUB_SHA\`."
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              grep -nE "error:|error :|BUILD FAILED|xcodebuild: error|The following build commands failed|fatal error|Undefined symbols" "$LOG" | tail -120
              echo "---- tail ----"
              tail -80 "$LOG"
            else
              echo "build.log не найден"
            fi
            echo '```'
          } > "$OUT"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI: build failed on $GITHUB_SHA" \
            --body-file "$OUT" || true