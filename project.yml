name: YMusic

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.3"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "15.3"
    TARGETED_DEVICE_FAMILY: "1"
    # TrollStore: подпись Apple-сертификатом не нужна (детали — Фаза 6).
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  YMusic:
    build:
      targets:
        YMusic: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  YMusic:
    type: application
    platform: iOS
    sources:
      - path: YMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ymusic
        PRODUCT_NAME: YMusic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: YMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: YMusic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        # Вход — через клиент официального приложения Яндекс.Музыки
        # (см. AuthConfig); собственных OAuth-ключей в бандле нет.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
