name: YMusic

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.3"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "15.3"
    TARGETED_DEVICE_FAMILY: "1"
    # TrollStore: подпись Apple-сертификатом не нужна (детали — Фаза 6).
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  YMusic:
    build:
      targets:
        YMusic: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  YMusic:
    type: application
    platform: iOS
    sources:
      - path: YMusic
      - path: Shared
    dependencies:
      - target: YMusicWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ymusic
        PRODUCT_NAME: YMusic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: YMusic/Resources/YMusic.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.ymusic
    info:
      path: YMusic/Resources/Info.plist
      properties:
        CFBundleDisplayName: YMusic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        # Вход — через клиент официального приложения Яндекс.Музыки
        # (см. AuthConfig); собственных OAuth-ключей в бандле нет.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSMicrophoneUsageDescription: "YMusic слушает, чтобы распознать трек вокруг вас"
        NSPhotoLibraryAddUsageDescription: "YMusic сохраняет открытку с треком в вашу медиатеку"
        CFBundleURLTypes:
          - CFBundleURLName: com.example.ymusic.track
            CFBundleURLSchemes:
              - ymusic

  YMusicWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: YMusicWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ymusic.widget
        PRODUCT_NAME: YMusicWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
    info:
      path: YMusicWidget/Info.plist
      properties:
        CFBundleDisplayName: YMusic
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: YMusicWidget/YMusicWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.ymusic
